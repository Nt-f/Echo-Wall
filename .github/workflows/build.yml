name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm
      - uses: actions/upload-artifact@v4
        with:
          name: hassmic-homeview
          path: build/app/outputs/flutter-apk/app-release.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk hassmic-homeview.apk
          gh release create "$GITHUB_REF_NAME" hassmic-homeview.apk --title "$GITHUB_REF_NAME" --generate-notes
